# 跨平台打包：在 Windows / macOS / Linux 上用 PyInstaller 构建免安装可执行文件。
# - 推送到 tag（如 v1.2.3）时，自动创建 GitHub Release 并上传三个平台的产物。
# - 普通 push 到 main 也会构建，产物作为 Actions Artifact 保留 7 天，方便自测。
#
# 说明：本工具采用“方案 B”——不把 OCR 引擎打进包，终端用户按界面引导自行安装
# Tesseract / Umi-OCR 即可。CI 只负责把 Python 程序打包成各平台可执行文件。
name: Build (win/mac/linux)

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: file-xray-windows
          - os: macos-latest
            artifact: file-xray-macos
          - os: ubuntu-latest
            artifact: file-xray-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UPX (for smaller binaries)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y upx; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install upx; fi
        shell: bash
      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx -y
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
        shell: bash

      - name: Build with PyInstaller
        run: pyinstaller build.spec --noconfirm
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
